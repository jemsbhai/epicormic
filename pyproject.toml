[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epicormic"
version = "0.1.0"
description = "Provider drift detection and containment for pollard-governed AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muntaser Syed"}]
maintainers = [{name = "Muntaser Syed", email = "jemsbhai@gmail.com"}]
keywords = ["drift", "llm", "monitoring", "canary", "sequential-testing", "pollard", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pollard>=1.6.0,<2"]

[project.urls]
Homepage = "https://github.com/jemsbhai/epicormic"
Issues = "https://github.com/jemsbhai/epicormic/issues"

[project.optional-dependencies]
jsonld = ["jsonld-ex>=0.7.4,<0.8"]
cost = ["pollard[tokenmaster]>=1.6.0,<2"]
vector = ["numpy>=1.26"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "build",
  "hatchling>=1.25",
  "twine",
  "scipy>=1.13",
  "jsonld-ex>=0.7.4,<0.8",
  "pollard[tokenmaster]>=1.6.0,<2",
]

[project.scripts]
epicormic = "epicormic.cli:main"

[project.entry-points.pytest11]
epicormic = "epicormic.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/epicormic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:epicormic"

[tool.coverage.run]
source = ["src/epicormic"]
