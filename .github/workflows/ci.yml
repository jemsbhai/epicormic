name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests examples tools

      - name: Mypy
        run: python -m mypy src

      - name: Vocabulary and typography scan
        run: python tools/scan_vocabulary.py

      - name: Tests
        run: python -m pytest

  coverage:
    name: Coverage gate on Python 3.13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Coverage
        run: >-
          python -m pytest
          --cov=epicormic
          --cov-report=term-missing
          --cov-fail-under=90
