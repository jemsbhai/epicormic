name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests examples tools

      - name: Mypy
        run: python -m mypy src

      - name: Vocabulary and typography scan
        run: python tools/scan_vocabulary.py

      - name: Tests
        run: python -m pytest

  coverage:
    name: Coverage gate on Python 3.13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Coverage
        run: >-
          python -m pytest
          --cov=epicormic
          --cov-report=term-missing
          --cov-fail-under=90

  wheel:
    name: Installed-wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist --wheel .
          python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install --upgrade pip
          smoke/bin/python -m pip install dist/epicormic-*.whl

      - name: Smoke
        working-directory: ${{ runner.temp }}
        run: |
          REPO="$GITHUB_WORKSPACE"
          "$REPO/smoke/bin/python" -c "import epicormic; print(epicormic.__version__)"
          "$REPO/smoke/bin/epicormic" --version
          "$REPO/smoke/bin/python" -c "import importlib.metadata as m; names = [e.name for e in m.entry_points(group='pytest11')]; assert 'epicormic' in names, names"
          "$REPO/smoke/bin/python" "$REPO/examples/02_verdict.py"
